<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Iniciando Simulador de Atracação</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .splash-container {
      width: 480px;
      height: 310px;
      background: linear-gradient(145deg, #0b1325 0%, #080f1d 100%);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 18px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 35px rgba(6, 182, 212, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 34px 28px 26px;
      position: relative;
      overflow: hidden;
      color: #f8fafc;
    }

    /* Radar / Sonar pulse effect in the background */
    .sonar-emitter {
      position: absolute;
      top: -30px;
      right: -30px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 1px solid rgba(6, 182, 212, 0.15);
      pointer-events: none;
    }
    .sonar-emitter::before, .sonar-emitter::after {
      content: '';
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      border: 1px solid rgba(6, 182, 212, 0.08);
      animation: sonarPulse 3s infinite ease-out;
    }
    .sonar-emitter::after {
      animation-delay: 1.5s;
    }
    @keyframes sonarPulse {
      0% { transform: scale(0.6); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* Brand Logo / Icon Header */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 10;
    }

    .icon-wrap {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(16, 185, 129, 0.2));
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.25);
    }

    .icon-wrap svg {
      width: 32px;
      height: 32px;
      color: #38bdf8;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .badge-sub {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: blink 1.4s infinite ease-in-out;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Progress & Status Section */
    .status-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      width: 35%;
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #06b6d4, #10b981);
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
      transition: width 0.4s ease;
      position: relative;
    }
    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 1.8s infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .status-text-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: #94a3b8;
    }

    .status-message {
      font-weight: 500;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-percent {
      font-family: monospace;
      font-weight: 600;
      color: #38bdf8;
    }

    /* Footer info */
    .footer-note {
      font-size: 10px;
      color: #64748b;
      margin-top: -4px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="splash-container">
    <div class="sonar-emitter"></div>

    <div class="brand-section">
      <div class="icon-wrap">
        <!-- SVG Anchor / Ship -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="3"></circle>
          <line x1="12" y1="22" x2="12" y2="8"></line>
          <path d="M5 12H2a10 10 0 0 0 20 0h-3"></path>
        </svg>
      </div>
      <h1>Simulador de Atracação</h1>
      <div class="badge-sub">
        <span class="live-dot"></span>
        Praticagem RJ &bull; Terminal Rio
      </div>
    </div>

    <div class="status-section">
      <div class="progress-bar-bg">
        <div id="progressFill" class="progress-bar-fill"></div>
      </div>
      <div class="status-text-row">
        <span id="statusMsg" class="status-message">Iniciando sistema...</span>
        <span id="statusPct" class="status-percent">35%</span>
      </div>
    </div>

    <div class="footer-note">
      Desenvolvido por Dalmo dos Santos Cabral
    </div>
  </div>

  <script>
    // Listener para mensagens do processo Electron
    if (window.electronAPI) {
      window.electronAPI.onSplashUpdate((data) => {
        if (data.message) {
          document.getElementById('statusMsg').textContent = data.message;
        }
        if (typeof data.progress === 'number') {
          const pct = Math.min(100, Math.max(0, Math.round(data.progress)));
          document.getElementById('progressFill').style.width = pct + '%';
          document.getElementById('statusPct').textContent = pct + '%';
        }
      });
    }
  </script>
</body>
</html>
